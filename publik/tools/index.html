<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Tools Farid Jamil</title>
  <style>
    body { font-family: Arial, sans-serif; margin:0; padding:0; background:#f9f9f9; }
    header { background:#0077cc; color:white; padding:15px; text-align:center; }
    #content { padding:20px; }
  </style>
</head>
<body>
  <header>
    <h1>Portal Tools Farid Jamil</h1>
    <p>Semua isi otomatis dari publik/tools</p>
  </header>

  <div id="content">Memuat konten...</div>

  <script>
    // Ambil isi halaman asli
    fetch("https://faridjamil.github.io/publik/tools/")
      .then(res => res.text())
      .then(html => {
        document.getElementById("content").innerHTML = html;
      })
      .catch(err => {
        document.getElementById("content").innerHTML = "Gagal memuat konten: " + err;
      });
  </script>
</body>
</html>
